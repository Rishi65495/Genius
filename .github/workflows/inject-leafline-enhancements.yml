name: Inject Leafline enhancements
on:
  workflow_dispatch:
  push:
    paths:
      - 'leafline-performance.js'
      - 'leafline-audio.js'
      - 'leafline-ai.js'
      - 'leafline-auth-fix.js'
      - 'index.html'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tags='''<script src="supabase.js"></script>
<script src="leafline-performance.js"></script>
<script src="leafline-audio.js"></script>
<script src="leafline-ai.js"></script>
<script src="leafline-auth-fix.js"></script>'''
          for tag in tags.splitlines():
              s=s.replace(tag+'\n','')
          marker='</head>'
          if marker not in s: raise SystemExit('head marker missing')
          s=s.replace(marker,tags+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Commit injected loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable Leafline reader enhancements'
          git push