name: Lucid validation
on:
  push:
    branches: ["main","lucid-complete-v2"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check lucid-app.js
          node --check lucid-platform.js
          node --check supabase.js
          node --check leafline-ai.js
          node --check leafline-audio.js
          node --check leafline-auth-fix.js
          node --check leafline-performance.js
