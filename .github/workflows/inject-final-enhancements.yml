name: Leafline enhancement loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          names=['supabase.js','leafline-performance.js','leafline-audio.js','leafline-ai.js','leafline-auth-fix.js']
          for n in names:
              tag=f'<script src="{n}"></script>'
              s=s.replace(tag+'\n','').replace(tag,'')
          tags='\n'.join(f'<script src="{n}"></script>' for n in names)
          marker='</head>'
          if marker not in s:
              raise SystemExit('Could not find </head> in index.html')
          s=s.replace(marker,tags+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit enhancement injection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'Enhancement loaders already injected.'
            exit 0
          fi
          git commit -m "Load Leafline enhancements"
          git push